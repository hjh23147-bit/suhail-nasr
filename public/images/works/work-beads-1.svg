<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="amberGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3d2917" />
      <stop offset="60%" stop-color="#1c1109" />
      <stop offset="100%" stop-color="#0a0604" />
    </radialGradient>
    <radialGradient id="beadLight" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#eed8a1" />
      <stop offset="40%" stop-color="#b88b4a" />
      <stop offset="85%" stop-color="#4d3215" />
      <stop offset="100%" stop-color="#1a0f06" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#amberGrad)" />

  <!-- Macro Prayer Beads Strand Representation -->
  <g transform="translate(100, 50)">
    <!-- Defocused background beads -->
    <circle cx="150" cy="400" r="45" fill="#302013" opacity="0.4" />
    <circle cx="230" cy="380" r="50" fill="#3a2717" opacity="0.5" />
    <circle cx="490" cy="360" r="50" fill="#3a2717" opacity="0.5" />
    <circle cx="570" cy="390" r="45" fill="#302013" opacity="0.4" />

    <!-- Sharp focal bead (الشاهد) -->
    <path d="M 330 140 C 330 80, 410 80, 410 140 L 400 360 C 400 420, 340 420, 340 360 Z" 
          fill="url(#beadLight)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))" />

    <!-- Micro engraved calligraphy on the bead -->
    <path d="M 365 200 C 370 170, 385 170, 385 190 C 385 210, 360 215, 360 230 C 360 245, 380 250, 380 270" 
          fill="none" stroke="#0a0502" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 365 200 C 370 170, 385 170, 385 190 C 385 210, 360 215, 360 230 C 360 245, 380 250, 380 270" 
          fill="none" stroke="#D0BB88" stroke-width="1.5" stroke-linecap="round" />

    <circle cx="372" cy="165" r="2.5" fill="#0a0502" />
    <circle cx="372" cy="165" r="1.5" fill="#D0BB88" />
  </g>

  <!-- Title watermark -->
  <text x="700" y="540" text-anchor="end" font-family="'Amiri', serif" font-size="18" fill="#B79A5B" fill-opacity="0.7">نقش مجهري على سبحة خاصة — سهيل نصر</text>
  <text x="100" y="540" text-anchor="start" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#B79A5B" fill-opacity="0.4">SUHAIL NASR • ATELIER</text>
</svg>
