<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181c" />
      <stop offset="50%" stop-color="#0e1317" />
      <stop offset="100%" stop-color="#06090b" />
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D0BB88" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B79A5B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8F7238" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="specular" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#glassGrad)" />
  <rect width="800" height="600" fill="url(#specular)" />

  <!-- Glass facet lines -->
  <line x1="80" y1="40" x2="720" y2="40" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
  <line x1="80" y1="40" x2="80" y2="560" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
  <line x1="720" y1="40" x2="720" y2="560" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  <line x1="80" y1="560" x2="720" y2="560" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Engraved Calligraphy Strokes (Abstract Diwani Glass Engraving) -->
  <g filter="url(#glow)">
    <path d="M 220 380 C 260 220, 380 180, 520 220 C 620 250, 600 380, 480 410 C 350 440, 260 360, 310 270 C 340 210, 460 210, 490 280 C 510 340, 440 370, 390 350" 
          fill="none" stroke="url(#goldShimmer)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 330 180 C 360 140, 450 130, 480 170" fill="none" stroke="url(#goldShimmer)" stroke-width="5" stroke-linecap="round" />
    <circle cx="340" cy="150" r="6" fill="#D0BB88" />
    <circle cx="470" cy="140" r="5" fill="#D0BB88" />
    <circle cx="530" cy="200" r="5" fill="#D0BB88" />
  </g>

  <!-- Reflection Highlight -->
  <path d="M 120 80 L 260 80 L 180 520 L 100 520 Z" fill="#ffffff" fill-opacity="0.02" />

  <!-- Technical Watermark / Signature text -->
  <text x="700" y="540" text-anchor="end" font-family="'Amiri', serif" font-size="18" fill="#B79A5B" fill-opacity="0.6">أثر على زجاج بلوري — سهيل نصر</text>
  <text x="100" y="540" text-anchor="start" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#ffffff" fill-opacity="0.3">SUHAIL NASR • ATELIER</text>
</svg>
