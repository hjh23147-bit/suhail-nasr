<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1d14" />
      <stop offset="40%" stop-color="#3d281c" />
      <stop offset="70%" stop-color="#241710" />
      <stop offset="100%" stop-color="#19100b" />
    </linearGradient>
    <filter id="burn">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#woodBg)" />

  <!-- Subtle wood grain lines -->
  <path d="M 0 100 Q 400 120 800 90" stroke="#1f140e" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 0 180 Q 300 210 800 170" stroke="#4a3122" stroke-width="3" fill="none" opacity="0.4" />
  <path d="M 0 320 Q 500 290 800 340" stroke="#1f140e" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 0 440 Q 250 470 800 420" stroke="#4a3122" stroke-width="2.5" fill="none" opacity="0.4" />

  <!-- Charred Wood-Burnt Calligraphy -->
  <g filter="url(#burn)">
    <path d="M 240 400 C 270 200, 360 160, 540 180 C 640 190, 590 340, 480 370 C 370 400, 270 330, 320 250 C 360 190, 480 200, 490 270 C 500 320, 440 340, 390 320" 
          fill="none" stroke="#120b07" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 240 400 C 270 200, 360 160, 540 180 C 640 190, 590 340, 480 370 C 370 400, 270 330, 320 250 C 360 190, 480 200, 490 270 C 500 320, 440 340, 390 320" 
          fill="none" stroke="#B79A5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M 330 150 C 370 120, 470 120, 510 150" fill="none" stroke="#120b07" stroke-width="10" stroke-linecap="round" />
    <path d="M 330 150 C 370 120, 470 120, 510 150" fill="none" stroke="#B79A5B" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Title watermark -->
  <text x="700" y="540" text-anchor="end" font-family="'Amiri', serif" font-size="18" fill="#B79A5B" fill-opacity="0.7">تكوين ديواني على خشب الماهوجني — سهيل نصر</text>
  <text x="100" y="540" text-anchor="start" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#B79A5B" fill-opacity="0.4">SUHAIL NASR • ATELIER</text>
</svg>
